<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1a1020">
<title>Purple World</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1020; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%;
               -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* --app-w / --app-h / --game-h come from the fit() script below: they are the size of the part of the screen you can really see
     (a phone browser's toolbars make plain 100vh too tall, which hid the bottom of the game). The game keeps its 16:9 shape (letterboxed). */
  canvas { display: block; width: var(--app-w, 100vw); height: var(--app-h, 100dvh); object-fit: contain; margin: auto; touch-action: none; }

  /* ---- the strip with sound, API key, and where to get one ---- */
  #tools { position: fixed; top: 6px; right: 6px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #tools button, #keylink { white-space: nowrap; }
  #tools button { font: 12px sans-serif; padding: 4px 9px; border-radius: 6px; cursor: pointer; color: #fff;
                  border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); }
  #keylink { font: 12px sans-serif; color: #9fe0ff; text-decoration: underline; }
  #sndbtn.on { background: rgba(70,170,90,0.85); }
  #sndbtn.off { background: rgba(255,200,60,0.9); color: #222; font-weight: bold; }
  #keybtn.needed { background: rgba(255,200,60,0.9); color: #222; font-weight: bold; }
  #keybtn.rejected { background: rgba(255,90,90,0.95); color: #fff; font-weight: bold; }
  #buildinfo { position: fixed; left: 6px; bottom: 4px; z-index: 5; font: 10px sans-serif; color: rgba(255,255,255,0.4); pointer-events: none; }   /* which build this is */

  /* ---- PHONES AND TABLETS: body gets the class "mobile" (see the Mobile script below; add ?mobile=1 to the address to force it) ---- */
  #touch, #rotate, #soundhint { display: none; }
  body.mobile #buildinfo { display: none; }   /* (on a phone it only shows in tall portrait, below the game: see the portrait rules) */
  body.mobile #touch { display: block; }
  body.mobile { --b: clamp(46px, 12vmin, 64px); }                                   /* the size of one button */
  @media (orientation: landscape) and (max-height: 430px) {   /* a short screen (a phone on its side): smaller buttons, tucked into the side bars so they fit beside the game */
    body.mobile { --b: 40px; }
    body.mobile #pad { left: max(6px, env(safe-area-inset-left)); }
    body.mobile #acts { right: max(6px, env(safe-area-inset-right)); }
  }
  body.mobile #tools { top: 3px; left: 50%; right: auto; transform: translateX(-50%); flex-direction: row; align-items: center; }
  body.mobile #tools button { font-size: 11px; padding: 3px 7px; }
  body.mobile #keylink { font-size: 11px; }

  #touch button { width: var(--b); height: var(--b); border-radius: 50%; padding: 0; color: #fff; font: bold 12px sans-serif; -webkit-appearance: none; appearance: none;
                  border: 2px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.22); touch-action: none; pointer-events: auto; }
  #touch button.down { background: rgba(255,255,255,0.55); }
  #pad, #acts { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); pointer-events: none; }   /* (the gaps between buttons let taps through to the game) */
  /* left: the movement d-pad */
  #pad { left: max(10px, env(safe-area-inset-left)); display: grid; gap: 4px; grid-template-columns: repeat(3, var(--b)); grid-template-rows: repeat(3, var(--b));
         grid-template-areas: ". up ." "left . right" ". down ."; }
  #up { grid-area: up; } #down { grid-area: down; } #left { grid-area: left; } #right { grid-area: right; }
  /* right: the small buttons above (four to a row), the two big ones below */
  #acts { right: max(10px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #smalls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: calc((var(--b) * 0.95 + 5px) * 4); }
  #smalls button { width: calc(var(--b) * 0.95); height: calc(var(--b) * 0.95); font-size: 11px; }
  #bigs { display: flex; align-items: flex-end; gap: 10px; }
  #swing { background: rgba(200,120,60,0.55); }
  #action { width: calc(var(--b) * 1.45); height: calc(var(--b) * 1.45); font-size: 13px; background: rgba(140,70,200,0.6); }
  /* while a menu or conversation is open: the big button becomes "OK", the D-pad (up/down) stays as an alternative to tapping, and the rest get out of the way */
  #action .ok, body.menu #action .walk { display: none; }
  body.menu #action .ok { display: inline; }
  body.menu #swing, body.menu #smalls button:not(#back) { visibility: hidden; }

  /* portrait: the game sits on top at full width and everything else gets the empty space below it */
  @media (orientation: portrait) {
    body.mobile { --b: clamp(46px, 15vw, 78px); }
    body.mobile canvas { height: var(--game-h, 56.25vw); margin: 0; }
    body.mobile #smalls { max-width: calc((var(--b) * 0.95 + 5px) * 3); }   /* (three to a row: the d-pad sits beside them) */
    body.mobile #tools { top: calc(var(--game-h, 56.25vw) + 40px); }
    body.mobile #rotate { display: block; position: fixed; left: 0; right: 0; text-align: center; color: #cbb8d8; font: 13px sans-serif; top: calc(var(--game-h, 56.25vw) + 10px); }
  }
  @media (orientation: portrait) and (min-height: 600px) {
    body.mobile #soundhint, body.mobile #buildinfo { display: block; position: fixed; left: 0; right: 0; text-align: center; }
    body.mobile #soundhint { top: calc(var(--game-h, 56.25vw) + 74px); font: 12px sans-serif; color: #a99ab8; }
    body.mobile #buildinfo { top: calc(var(--game-h, 56.25vw) + 96px); bottom: auto; }
  }
</style>
<body>
  <canvas id="canvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>

  <div id="tools">
    <button id="keybtn" title="Set your Google Gemini API key">API key</button>
    <button id="sndbtn" title="Turn the game's sound on (and play a test chirp)">Sound</button>
    <a id="keylink" href="https://aistudio.google.com/api-keys?projectFilter=gen-lang-client-0222120615" target="_blank" rel="noopener">Get a free key</a>
  </div>
  <div id="rotate">Turn your phone sideways for a bigger view</div>
  <div id="soundhint">No sound? Switch off silent mode and turn the volume up.</div>
  <div id="buildinfo"></div>

  <!-- On-screen buttons (phones and tablets only). Each one presses the matching keyboard key, so the game needs no special code for them. -->
  <div id="touch">
    <div id="pad">
      <button id="up" data-key="ArrowUp">&#9650;</button>
      <button id="left" data-key="ArrowLeft">&#9664;</button>
      <button id="right" data-key="ArrowRight">&#9654;</button>
      <button id="down" data-key="ArrowDown">&#9660;</button>
    </div>
    <div id="acts">
      <div id="smalls">
        <button id="back" data-key="Escape">Back</button>
        <button id="save" data-key="KeyP">Save</button>
        <button id="guess" data-key="KeyG">Guess</button>
        <button id="lookL" data-key="KeyQ">&#8634;</button>
        <button id="lookR" data-key="KeyE">&#8635;</button>
        <button id="zoomIn" data-key="KeyZ">+</button>
        <button id="zoomOut" data-key="KeyX">&minus;</button>
      </div>
      <div id="bigs">
        <button id="swing" data-key="KeyF">Attack</button>
        <button id="action" data-key="Space"><span class="walk">Jump / Talk</span><span class="ok">OK</span></button>
      </div>
    </div>
  </div>

  <script>
    // The size of the part of the screen you can really see. A phone browser's toolbars make plain 100vh too tall (the bottom of the game ends up
    // hidden under them), so the page measures it and the CSS above uses these numbers. It re-measures when you turn the phone or the toolbars move.
    function fit() {
      var r = document.documentElement.style, w = innerWidth, h = innerHeight;
      r.setProperty('--app-w', w + 'px'); r.setProperty('--app-h', h + 'px'); r.setProperty('--game-h', Math.round(w * 9 / 16) + 'px');
    }
    fit(); addEventListener('resize', fit); addEventListener('orientationchange', function () { setTimeout(fit, 200); });
    if (window.visualViewport) visualViewport.addEventListener('resize', fit);

     // SOUND. In the browser the game plays YOUR sound files 
        window.GameAudio = (function () {
      var Ctor = window.AudioContext || window.webkitAudioContext;
      // LOUDNESS: every file is first normalised to the same peak (so quiet old files and loud new ones sound alike), then sound effects are
      // played through a quieter bus than the music. Change these two numbers to taste (0 = silent, 1 = loudest).
      var SFX_LEVEL = 0.30, MUSIC_LEVEL = 0.45, TARGET_PEAK = 0.6;
      var NAMES = ['footstep', 'jump', 'door', 'blip', 'talk', 'music'];
      // iPHONES: web audio is MUTED while the phone's silent switch is on (Safari even shows the speaker icon while you hear nothing). Marking the page as
      // "playback" audio, and playing a silent clip once, tells iOS this is real audio, so it plays regardless of the switch.
      var IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), silentEl = null;
      function iosFix() {
        try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
        if (!IOS || silentEl) return;
        try {
          var n = 2205, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
          var tag = function (o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
          tag(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); tag(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
          v.setUint32(24, 22050, true); v.setUint32(28, 44100, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); tag(36, 'data'); v.setUint32(40, n * 2, true);
          silentEl = document.createElement('audio');
          silentEl.setAttribute('playsinline', ''); silentEl.loop = true;
          silentEl.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
          var p = silentEl.play(); if (p && p.catch) p.catch(function () { silentEl = null; });   // not allowed yet: try again at the next tap
        } catch (e) { silentEl = null; }
      }
      var ctx = null, master = null, sfxBus = null, musicBus = null, analyser = null, noiseBuf = null;
      var files = {}, buffers = {}, decoding = {}, pending = 0, volume = 1;
      var unlocked = false, musicStarted = false, musicSynth = false, musicNode = null, nextBar = 0, bar = 0;
      var CHORDS = [[261.63, 329.63, 392.0], [220.0, 261.63, 329.63], [174.61, 220.0, 261.63], [196.0, 246.94, 293.66]];   // C, Am, F, G

      function ensure() {                        // create (on the first gesture) and wake the audio engine
        if (!Ctor) return false;
        if (!ctx) {
          ctx = new Ctor();
          master = ctx.createGain(); master.gain.value = volume;
          analyser = ctx.createAnalyser(); analyser.fftSize = 512;     // (only read by the tests, to prove the sound is not silent)
          master.connect(analyser); analyser.connect(ctx.destination);
          sfxBus = ctx.createGain(); sfxBus.gain.value = SFX_LEVEL; sfxBus.connect(master);
          musicBus = ctx.createGain(); musicBus.gain.value = MUSIC_LEVEL; musicBus.connect(master);
          noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.4), ctx.sampleRate);
          var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          Object.keys(files).forEach(decodeOne);                       // files that arrived before the first key press
        }
        if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
        return true;
      }
      function decodeOne(name) {                 // turn a file's bytes into playable audio, and note how loud it is so it can be normalised
        if (!ctx || !files[name] || buffers[name] || decoding[name]) return;
        decoding[name] = true; pending++;
        function done(buf) {
          pending--; delete decoding[name];
          if (buf) {
            var peak = 0;
            for (var c = 0; c < buf.numberOfChannels; c++) { var d = buf.getChannelData(c); for (var i = 0; i < d.length; i++) { var v = Math.abs(d[i]); if (v > peak) peak = v; } }
            buffers[name] = { buf: buf, gain: peak > 0.001 ? TARGET_PEAK / peak : 1 };
            if (name === 'music' && musicStarted && !musicNode) { musicSynth = false; startFileMusic(); }   // the file arrived after the built-in loop had begun: switch over
          }
          if (pending === 0 && unlocked) startMusic();
          refreshButton();
        }
        try {
          var pr = ctx.decodeAudioData(files[name].slice(0), function (b) { done(b); }, function () { done(null); });
          if (pr && pr.catch) pr.catch(function () {});     // (a bad file also rejects this promise: the error callback above already handled it)
        } catch (e) { done(null); }
      }
      // one note: oscillator to its own volume envelope (quick attack, exponential fade) to a bus
      function tone(type, f0, f1, t0, dur, peak, bus, attack) {
        var o = ctx.createOscillator(), g = ctx.createGain(), at = attack || 0.005;
        o.type = type; o.frequency.setValueAtTime(f0, t0);
        if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + at); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(bus || sfxBus); o.start(t0); o.stop(t0 + dur + 0.05);
      }
      function noise(t0, dur, peak, cutoff) {
        var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = cutoff;
        g.gain.setValueAtTime(peak, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t0); s.stop(t0 + dur + 0.02);
      }
      var SFX = {                                // the built-in fallbacks (used only for a sound whose file is missing)
        talk:     function (t) { tone('sine', 587.33, 0, t, 0.11, 0.6); tone('sine', 880, 0, t + 0.11, 0.2, 0.6); tone('sine', 1174.7, 0, t + 0.11, 0.2, 0.15); },
        blip:     function (t) { tone('sine', 1046.5, 0, t, 0.1, 0.5); },
        footstep: function (t) { tone('sine', 95, 50, t, 0.13, 0.55); noise(t, 0.1, 0.3, 900); },
        jump:     function (t) { tone('sine', 280, 930, t, 0.22, 0.5); },
        door:     function (t) { tone('square', 110, 75, t, 0.28, 0.12); tone('sine', 70, 45, t + 0.28, 0.2, 0.7); noise(t + 0.28, 0.18, 0.35, 500); }
      };
      // background music: your music.wav looped, or (if there is no file) a gentle built-in loop scheduled a little ahead of time
      function startFileMusic() {
        var b = buffers.music; if (!b || musicNode) return;
        var s = ctx.createBufferSource(), g = ctx.createGain();
        s.buffer = b.buf; s.loop = true; g.gain.value = b.gain; s.connect(g); g.connect(musicBus); s.start(); musicNode = s;
      }
      function scheduleMusic() {
        if (!ctx || !musicStarted || !musicSynth || ctx.state !== 'running') return;
        while (nextBar < ctx.currentTime + 1.5) {
          var ch = CHORDS[bar % 4];
          for (var i = 0; i < 3; i++) tone('triangle', ch[i] / 2, 0, nextBar, 4.0, 0.12, musicBus, 0.5);
          for (var k = 0; k < 8; k++) tone('sine', ch[k % 3] * 2, 0, nextBar + k * 0.5, 0.45, 0.07, musicBus);
          nextBar += 4.0; bar++;
        }
      }
      function startMusic() {
        if (musicStarted || !ctx) return;
        musicStarted = true;
        if (buffers.music) startFileMusic(); else { musicSynth = true; nextBar = ctx.currentTime + 0.1; scheduleMusic(); }
      }
      setInterval(scheduleMusic, 400);

      var api = {
        status: function () { return !ctx ? 0 : (ctx.state === 'running' ? 2 : 1); },          // 0 = not started yet, 1 = waiting for a key press/click, 2 = on
        loadWav: function (name, bytes) {                                                       // called by the game at startup, once per sound file
          if (NAMES.indexOf(name) < 0 || !bytes || !bytes.byteLength) return;
          files[name] = (bytes.buffer && bytes.byteOffset === 0 && bytes.byteLength === bytes.buffer.byteLength) ? bytes.buffer : bytes.slice().buffer;
          decodeOne(name); refreshButton();
        },
        filesUsed: function () { return Object.keys(buffers).length; },                         // how many of your sound files are actually playing
        unlock: function () {                                                                    // called by any key press, click or tap
          iosFix();
          if (!ensure()) return;
          unlocked = true; if (pending === 0) startMusic(); scheduleMusic(); refreshButton();
        },
        play: function (name) {
          if (!ctx) return;
          if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
          var b = name !== 'music' && buffers[name], t = ctx.currentTime + 0.005;
          if (b) { var s = ctx.createBufferSource(), g = ctx.createGain(); s.buffer = b.buf; g.gain.value = b.gain; s.connect(g); g.connect(sfxBus); s.start(t); }
          else if (SFX[name]) SFX[name](t);
        },
        setVolume: function (v) { volume = Math.max(0, Math.min(1, v)); if (master) master.gain.value = volume; },
        test: function () { if (ensure()) { api.unlock(); api.play('talk'); } refreshButton(); },
        _setMusic: function (on) { if (musicBus) musicBus.gain.value = on ? MUSIC_LEVEL : 0; },                 // (tests only: measure the effects without the music)
        _freq: function () {                                                                     // the loudest pitch right now, in Hz (for the automated tests: tells a file from a built-in sound)
          if (!analyser) return 0; var d = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(d);
          var bi = 0; for (var i = 1; i < d.length; i++) if (d[i] > d[bi]) bi = i; return bi * ctx.sampleRate / analyser.fftSize;
        },
        _level: function () {                                                                    // loudest sample right now (for the automated tests)
          if (!analyser) return 0; var d = new Float32Array(analyser.fftSize); analyser.getFloatTimeDomainData(d);
          var m = 0; for (var i = 0; i < d.length; i++) m = Math.max(m, Math.abs(d[i])); return m;
        }
      };
      function refreshButton() {
        var b = document.getElementById('sndbtn'); if (!b) return;
        var st = !Ctor ? -1 : api.status(), n = api.filesUsed();
        b.className = st === 2 ? 'on' : 'off';
        var phone = document.body.classList.contains('mobile');
        b.textContent = st === -1 ? 'Sound: not supported' : (st === 2 ? (phone ? 'Sound on' : 'Sound: on - ' + (n ? n + ' of 6 sound files' : 'built-in sounds')) : (phone ? 'Sound off: tap' : 'Sound off - click here or press any key'));
      }
      ['keydown', 'pointerdown', 'pointerup', 'mousedown', 'touchstart', 'touchend', 'click'].forEach(function (t) { window.addEventListener(t, function () { api.unlock(); }, true); });
      setInterval(refreshButton, 500);
      document.addEventListener('DOMContentLoaded', function () { var b = document.getElementById('sndbtn'); if (b) b.onclick = function (e) { e.stopPropagation(); api.test(); }; refreshButton(); });
      return api;
    })();
    var Module = { canvas: document.getElementById('canvas') };
    // stop Space and arrow keys from scrolling the page
    // Arrows never type anything, so they are always kept from scrolling. Space is only blocked while a BUTTON or link has the keyboard focus (so the game's Space key cannot "press" it):
    // blocking it everywhere cancels the browser's typed-character event, which is what stopped you typing spaces into an answer box.
    addEventListener('keydown', e => {
      if (e.code.startsWith('Arrow')) e.preventDefault();
      else if (e.code == 'Space' && /^(BUTTON|A)$/.test((document.activeElement || {}).tagName)) e.preventDefault();
    });

      // PHONES AND TABLETS. Three jobs, all small
     window.Mobile = (function () {
      var GW = 960, GH = 540, q = location.search;
      var KEYS = { ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, Space: 32, Escape: 27, Enter: 13,
                   KeyE: 69, KeyF: 70, KeyG: 71, KeyP: 80, KeyQ: 81, KeyX: 88, KeyZ: 90 };
      var on = /[?&]mobile=1/.test(q) || (matchMedia('(pointer: coarse)').matches && !/[?&]mobile=0/.test(q));
      var canvas = document.getElementById('canvas'), tapped = -1, drag = 0, down = null, held = {};
      document.body.classList.toggle('mobile', on);
      if (on) document.addEventListener('contextmenu', function (e) { e.preventDefault(); });   // (no long-press pop-up menu over the buttons)

      function fire(type, code) {                                   // a keyboard event the game's key library accepts
        var ev = new KeyboardEvent(type, { code: code, key: code, bubbles: true, cancelable: true });
        Object.defineProperty(ev, 'keyCode', { get: function () { return KEYS[code]; } });
        Object.defineProperty(ev, 'which', { get: function () { return KEYS[code]; } });
        window.dispatchEvent(ev);
      }
      function bind(btn) {                                          // hold the button = hold the key (several buttons at once work)
        var code = btn.dataset.key, t0 = 0;
        btn.addEventListener('pointerdown', function (e) {
          e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch (x) {}
          btn.classList.add('down'); t0 = Date.now();
          if (!held[code]) { held[code] = 1; fire('keydown', code); }
        });
        function up() {
          if (!btn.classList.contains('down')) return;
          btn.classList.remove('down');
          setTimeout(function () { if (held[code]) { held[code] = 0; fire('keyup', code); } }, Math.max(0, 70 - (Date.now() - t0)));   // (a very quick tap still lasts a few frames, so the game sees it)
        }

      }
      document.querySelectorAll('#touch button[data-key]').forEach(bind);
      addEventListener('blur', function () { Object.keys(held).forEach(function (c) { if (held[c]) { held[c] = 0; fire('keyup', c); } }); });

      function gameRect() {                                         // where the 16:9 game picture actually is inside the (letterboxed) canvas
        var r = canvas.getBoundingClientRect(), w = canvas.width || GW, h = canvas.height || GH, s = Math.min(r.width / w, r.height / h);
        return { x: r.left + (r.width - w * s) / 2, y: r.top + (r.height - h * s) / 2, s: s, w: w, h: h };
      }
      canvas.addEventListener('pointerdown', function (e) { down = { id: e.pointerId, x: e.clientX, y: e.clientY, lx: e.clientX, far: 0, touch: e.pointerType === 'touch' }; });
      canvas.addEventListener('pointermove', function (e) {
        if (!down || e.pointerId !== down.id) return;
        down.far = Math.max(down.far, Math.hypot(e.clientX - down.x, e.clientY - down.y));
        if (down.touch && down.far > 10) { drag += (e.clientX - (down.dragging ? down.lx : down.x)) / gameRect().s; down.dragging = true; }   // a finger drag turns the camera (a tap's wobble does not; the mouse is handled by the game itself)
        down.lx = e.clientX;
      });
      canvas.addEventListener('pointerup', function (e) {
        var d = down; down = null;

    //  "N users played this game!": a public counter that goes up by one the first time a browser enters an API key ----
    // Only a fixed name is ever sent to the counter service: never the key, nothing about you. If the service is unreachable the game simply shows no number.
    // (To use a different counter service, change COUNTER; it needs two GET endpoints that return {"value": N}: one that reads and one that adds one.)
    const COUNTER = { base: 'https://abacus.jasoncameron.dev', ns: 'purple-world-cppgame', name: 'api-key-users', flag: 'userCounted1' };
    window.UserCount = {
      count: -1,                                                              // -1 = unknown: the game then shows nothing
      _read(url) {                                                            // -> Promise<true if the service answered with a number>
        return fetch(url).then(r => r.ok ? r.json() : Promise.reject()).then(j => { const v = Number(j && j.value); if (!isFinite(v) || v < 0) return false; this.count = Math.floor(v); return true; }).catch(() => false);
      },
      load() { return this._read(COUNTER.base + '/get/' + COUNTER.ns + '/' + COUNTER.name); },
      bump(key) {                                                             // called whenever a key is entered
        let done = false; try { done = !!localStorage.getItem(COUNTER.flag); } catch (e) {}
        if (done || !key || key.length < 20 || /\s/.test(key)) return Promise.resolve(false);   // once per browser, and only for something that looks like a key
        return this._read(COUNTER.base + '/hit/' + COUNTER.ns + '/' + COUNTER.name).then(ok => { if (ok) try { localStorage.setItem(COUNTER.flag, '1'); } catch (e) {} return ok; });
      }
    };
    window.UserCount.load();
    document.getElementById('keybtn').onclick = () => askForKey(window.AIDialogue.error ? 'Google rejected that key.' : '');
  </script>
